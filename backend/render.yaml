services:
  - type: web
    name: nexora-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn nexora_core.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: nexora-api.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_HSTS_SECONDS
        value: "31536000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://nexora.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://nexora.vercel.app
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: CSRF_COOKIE_SAMESITE
        value: "None"
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: GEMINI_REQUEST_TIMEOUT_MS
        value: "25000"
      - key: GEMINI_RETRY_ATTEMPTS
        value: "1"
      - key: GROWTH_MAX_ADDON_OFFERS
        value: "2"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_ALERT_ATTEMPTS
        value: "3"
      - key: RAZORPAY_RECONCILIATION_STALE_MINUTES
        value: "10"
      - key: RAZORPAY_REFUND_MAX_AMOUNT
        value: "100000.00"
      - key: DEMO_BUYER_USERNAME
        sync: false
      - key: DEMO_BUYER_EMAIL
        sync: false
      - key: DEMO_BUYER_PASSWORD
        sync: false
      - key: DEMO_MERCHANT_USERNAME
        sync: false
      - key: DEMO_MERCHANT_EMAIL
        sync: false
      - key: DEMO_MERCHANT_PASSWORD
        sync: false
      - key: DEMO_MERCHANT_NAME
        sync: false

  - type: cron
    name: nexora-expire-checkouts
    runtime: python
    rootDir: backend
    plan: starter
    region: oregon
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py expire_checkouts --limit 1000
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSLMODE
        value: require

  - type: cron
    name: nexora-reconcile-razorpay
    runtime: python
    rootDir: backend
    plan: starter
    region: oregon
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py reconcile_razorpay --limit 1000
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_RECONCILIATION_STALE_MINUTES
        value: "10"
