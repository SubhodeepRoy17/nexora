services:
  - type: web
    name: nexora-api
    runtime: python
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: pip install --require-hashes -r requirements.lock && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py check --deploy && python manage.py migrate --noinput && python manage.py setup_pgvector && python manage.py deployment_status --allow-schedulers-pending
    startCommand: gunicorn nexora_core.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60
    healthCheckPath: /api/health/ready/
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_HSTS_SECONDS
        value: "31536000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: CSRF_COOKIE_SAMESITE
        value: "None"
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: GEMINI_REQUEST_TIMEOUT_MS
        value: "25000"
      - key: GEMINI_RETRY_ATTEMPTS
        value: "1"
      - key: GROWTH_MAX_ADDON_OFFERS
        value: "2"
      - key: MONEY_REQUIRE_RAZORPAY_TEST_MODE
        value: "True"
      - key: OPS_SCHEDULER_MAX_AGE_MINUTES
        value: "15"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_ALERT_ATTEMPTS
        value: "3"
      - key: RAZORPAY_RECONCILIATION_STALE_MINUTES
        value: "10"
      - key: RAZORPAY_REFUND_MAX_AMOUNT
        value: "100000.00"
      - key: DEMO_BUYER_USERNAME
        sync: false
      - key: DEMO_BUYER_EMAIL
        sync: false
      - key: DEMO_BUYER_PASSWORD
        sync: false
      - key: DEMO_MERCHANT_USERNAME
        sync: false
      - key: DEMO_MERCHANT_EMAIL
        sync: false
      - key: DEMO_MERCHANT_PASSWORD
        sync: false
      - key: DEMO_MERCHANT_NAME
        sync: false

  - type: cron
    name: nexora-expire-checkouts
    runtime: python
    rootDir: backend
    plan: starter
    region: oregon
    schedule: "*/5 * * * *"
    buildCommand: pip install --require-hashes -r requirements.lock
    startCommand: python manage.py expire_checkouts --limit 1000
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSLMODE
        value: require

  - type: cron
    name: nexora-reconcile-razorpay
    runtime: python
    rootDir: backend
    plan: starter
    region: oregon
    schedule: "*/5 * * * *"
    buildCommand: pip install --require-hashes -r requirements.lock
    startCommand: python manage.py reconcile_razorpay --limit 1000
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_RECONCILIATION_STALE_MINUTES
        value: "10"
      - key: MONEY_REQUIRE_RAZORPAY_TEST_MODE
        value: "True"
